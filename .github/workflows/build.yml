name: Build Windows Installer

# The installer is built ONLY on GitHub Actions, never on a developer machine.
# V1 flow: commit -> push -> click "Run workflow" (one build per milestone).
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "同时把安装包发布到 GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build NSIS installer (x64)
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install stable Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Makes cl.exe and the Windows SDK import libraries (rstrtmgr.lib,
      # kernel32.lib, ...) available to rustc / cc / link.exe.
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Typecheck + build frontend
        run: npm run build

      # Fail fast with readable Rust diagnostics before the expensive bundling.
      - name: Typecheck Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installer
        run: npm run tauri build
        env:
          RUST_BACKTRACE: "1"

      - name: Collect installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundle = Join-Path $PWD "src-tauri\target\release\bundle"
          if (-not (Test-Path $bundle)) { throw "No bundle directory was produced" }
          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts
            Write-Host "installer: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }
          $count = (Get-ChildItem artifacts -File | Measure-Object).Count
          if ($count -eq 0) { throw "No installer was produced" }
          Get-ChildItem artifacts -File | Format-Table Name, Length

      # Artifacts are a convenience; an exhausted account-level artifact
      # quota must never invalidate an otherwise successful build.
      - name: Upload installer artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: FileLineage-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      # Release assets are the durable delivery channel and are not billed
      # against the Actions artifact storage quota.
      - name: Publish GitHub Release
        if: ${{ !cancelled() && (inputs.create_release || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.2.0-{0}', github.run_number) }}
          name: FileLineage V2
          body: |
            Windows x64 安装包（NSIS）。

            V2：常驻托盘 + 开机自启 + 单实例；ETW 真·进程级归因（需管理员）、
            Zone.Identifier 来源证据、卷号 + FileID 文件身份、分块 BLAKE3、
            部分相同判定、90 天事件冷热归档、Shell 打开记录。
            前端界面与 V1 一致，界面改版留到 V3。
            数据全部保存在本机 SQLite，不上传任何内容。
          files: artifacts/*
