[package]
name = "file-lineage"
version = "0.4.0"
description = "文件因果溯源台 — file causality & lineage for Windows, macOS and Linux"
authors = ["FileLineage"]
edition = "2021"
# tauri 2.12 declares rust-version 1.90, so state the real floor.
rust-version = "1.90"

[lib]
name = "file_lineage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
walkdir = "2"
# Platform directories (data dir, Downloads/Desktop/Documents, browser roots).
# `Cargo.lock` already carries dirs 7.0.0 as a Tauri transitive dependency, so
# this adds no new download.
dirs = "7"

# Real process-level attribution: Microsoft-Windows-Kernel-File over ETW.
# Pinned exactly: the 1.x callback/schema API is not yet stable across minors.
# Windows-only: ferrisetw has no target gating of its own, and ETW does not
# exist on macOS/Linux, so it must not be built there at all.
[target.'cfg(windows)'.dependencies]
ferrisetw = "=1.2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Deliberately NOT `panic = "abort"`: the app runs several background threads
# (ETW callback, watcher, hasher, maintenance). With unwinding a bug in one of
# them degrades that feature instead of killing the resident daemon.

[profile.dev]
incremental = true
