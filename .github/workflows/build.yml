name: Build & Release

# Three-platform matrix. The bundling itself happens ONLY on GitHub Actions.
# Flow: version-guard -> build (matrix, artifacts) -> release (single job).
# A `check_only` dispatch runs cargo check per platform and stops before
# bundling, so all three platforms' compile errors are collected in one run.
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "同时把产物发布到 GitHub Release"
        type: boolean
        default: false
      check_only:
        description: "只跑 cargo check / cargo test（不打包、不发布）"
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version-guard:
    runs-on: ubuntu-22.04
    # Job-level outputs are the ONLY channel other jobs can read; the step
    # output alone is invisible outside this job (that is what produced the
    # empty tag/name release on the first tag run).
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        id: v
        run: node scripts/check-version.mjs >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }}
    needs: version-guard
    strategy:
      # Collect every platform's failure in one run instead of stopping at the
      # first one.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: FileLineage-Windows-x64
            bundles: nsis
            shell: pwsh
            timeout: 75
            # Host target: x86_64 MSVC, installed by default.
            rustup_targets: ""
            bundle_flag: ""
          - platform: macos-latest
            artifact: FileLineage-macOS-universal
            bundles: "app,dmg"
            shell: bash
            timeout: 90
            # `universal-apple-darwin` is a Tauri bundler pseudo-target, NOT a
            # rustup triple: install both real arches, and let the CLI drive
            # the universal build via bundle_flag.
            rustup_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle_flag: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            artifact: FileLineage-Linux-x64
            bundles: "deb,appimage"
            shell: bash
            timeout: 75
            rustup_targets: ""
            bundle_flag: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: ${{ matrix.timeout }}

    # Job-level (not workflow-level): the `matrix` context is only available
    # here, and per-platform groups keep a matrix run from cancelling its
    # sibling platforms. Release builds are never cancelled mid-flight.
    concurrency:
      group: release-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustup_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # Makes cl.exe and the Windows SDK import libraries (rstrtmgr.lib,
      # kernel32.lib, ...) available to rustc / cc / link.exe.
      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Typecheck + build frontend
        run: npm run build

      # Fail fast with readable Rust diagnostics before the expensive bundling.
      # Windows and Linux check the host target. macOS checks the *host* arch:
      # `cargo check --target x86_64-apple-darwin` on the runner would still
      # compile every crate and burn minutes; a host check catches cfg/module
      # mistakes (the actual risk) without duplicating the bundle build.
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Unit tests are pure logic (verdict scoring, schema migration); they run
      # where a linker exists for test binaries and no GUI is required. On
      # macOS the tests build for the *host* target: a universal test binary
      # cannot be executed by the runner.
      - name: Cargo test (lib)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Bundle installers
        if: ${{ !inputs.check_only }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.bundle_flag }}
        env:
          RUST_BACKTRACE: "1"

      # A green build with zero installers is not a release: assert the exact
      # bundle kinds each platform must produce.
      - name: Assert artifacts exist (Windows)
        if: ${{ !inputs.check_only && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"
          $installers = @(Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw "No Windows installer (.exe/.msi) was produced" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installers | Copy-Item -Destination artifacts
          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Assert artifacts exist (macOS)
        if: ${{ !inputs.check_only && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          found=0
          # macOS runners ship bash 3.2 (no globstar), so collect with find.
          while IFS= read -r -d '' f; do
            cp "$f" artifacts/; found=1
          done < <(find src-tauri/target -path '*/bundle/dmg/*.dmg' -print0)
          while IFS= read -r -d '' f; do
            ditto -c -k --sequesterRsrc --keepParent "$f" "artifacts/$(basename "$f").zip"; found=1
          done < <(find src-tauri/target -path '*/bundle/macos/*.app' -print0)
          [ "$found" -eq 1 ] || { echo "No macOS .dmg/.app was produced"; exit 1; }
          ls -la artifacts

      - name: Assert artifacts exist (Linux)
        if: ${{ !inputs.check_only && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          found=0
          # find-based collection: identical to the macOS step, no globstar.
          while IFS= read -r -d '' f; do
            chmod +x "$f" 2>/dev/null || true
            cp "$f" artifacts/; found=1
          done < <(find src-tauri/target \( -path '*/bundle/deb/*.deb' -o -path '*/bundle/appimage/*.AppImage' \) -print0)
          [ "$found" -eq 1 ] || { echo "No Linux .deb/.AppImage was produced"; exit 1; }
          ls -la artifacts

      # Artifacts are a convenience; an exhausted account-level artifact quota
      # must never invalidate an otherwise successful build.
      - name: Upload build artifact
        if: ${{ !inputs.check_only }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  # Exactly ONE release job writes the release: three concurrent gh-release
  # calls against the same tag used to 422 and overwrite each other's assets.
  release:
    # `needs: build` alone is NOT enough: a matrix job's needs scope carries
    # only the matrix summary, whose outputs are empty — that is why the
    # first tag run published a release tagged "v" with an empty version.
    needs: [build, version-guard]
    if: ${{ !cancelled() && !failure() && !inputs.check_only && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assert deliverables are present
        run: |
          set -euo pipefail
          ls -la dist
          count=$(find dist -type f | wc -l)
          [ "$count" -ge 3 ] || { echo "Expected at least 3 platform deliverables, found $count"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-guard.outputs.version }}
          name: FileLineage v${{ needs.version-guard.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
